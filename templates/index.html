<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Leaf</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- applicato subito, prima che il resto della pagina si disegni: uno script type="module"
       in fondo al body (vedi main.js) viene eseguito solo a parsing completo, e nel
       frattempo si vedrebbe un lampo col tema chiaro anche se l'utente ha scelto lo scuro -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("leaf-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {
        /* localStorage non disponibile (es. cookie di terze parti bloccati): resta il tema automatico */
      }
    })();
  </script>
</head>
<body data-view="albero">

  <header id="topbar">
    <h1>Leaf</h1>
    <nav id="view-switch">
      <button class="view-btn active" data-view="albero">Albero</button>
      <button class="view-btn" data-view="foglie">Foglie</button>
      <button class="view-btn" data-view="carico">Carico di lavoro</button>
      <button class="view-btn" data-view="ticket">Banane</button>
    </nav>
    <div id="user-info" class="hidden">
      <span id="current-username"></span>
      <button id="settings-btn" type="button" title="Impostazioni">⚙️</button>
      <button id="logout-btn" type="button">Esci</button>
    </div>
  </header>

  <div id="toolbar">
    <button id="add-root-task" class="tree-only">+ Progetto</button>
    <button id="expand-all" class="tree-only">Espandi tutto</button>
    <button id="collapse-all" class="tree-only">Collassa tutto</button>
    <button id="add-ticket-task" class="ticket-only">+ Colpisci qualcuno con una banana</button>
    <button id="view-all-toggle" class="hidden" title="Vedi tutti i progetti e nodi di tutti gli utenti (superuser)">🌐 Vedi tutto</button>
  </div>

  <div id="workspace">
    <div id="main-panel"></div>
    <div id="panel-resize-handle" class="tree-only"></div>
    <div id="side-panel"></div>
  </div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-box">
      <h2>Impostazioni</h2>
      <fieldset>
        <legend>Tema</legend>
        <label class="checkbox-label">
          <input type="radio" name="theme" value="auto"> Automatico (segue il sistema)
        </label>
        <label class="checkbox-label">
          <input type="radio" name="theme" value="light"> Chiaro
        </label>
        <label class="checkbox-label">
          <input type="radio" name="theme" value="dark"> Scuro
        </label>
      </fieldset>
      <div class="modal-actions">
        <button type="button" id="settings-close">Chiudi</button>
      </div>
    </div>
  </div>

  <div id="login-overlay" class="hidden">
    <div id="login-box">
      <h2>Accedi</h2>
      <form id="login-form">
        <label>Utente
          <input id="login-username" required autocomplete="username">
        </label>
        <label>Password
          <input id="login-password" type="password" required autocomplete="current-password">
        </label>
        <div id="login-error" class="hidden"></div>
        <div class="modal-actions">
          <button type="submit">Accedi</button>
        </div>
      </form>
    </div>
  </div>

  <div id="dependency-picker-overlay" class="hidden">
    <div id="dependency-picker-box">
      <h2>Scegli le dipendenze</h2>
      <p class="hint">Il task potrà iniziare solo quando queste dipendenze saranno risolte.</p>
      <div id="dependency-picker-tree"></div>
      <div class="modal-actions">
        <button type="button" id="dependency-picker-confirm">Conferma</button>
        <button type="button" id="dependency-picker-cancel">Annulla</button>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <h2 id="modal-title">Configura nodo</h2>
      <form id="node-form">
      <fieldset id="node-fieldset">
        <div class="form-field form-field--full">
          <label for="field-title">Titolo</label>
          <input id="field-title" maxlength="60" required>
        </div>
        <div class="form-field form-field--full">
          <label for="field-description">Descrizione</label>
          <textarea id="field-description" maxlength="300"></textarea>
        </div>
        <div class="form-row hidden" id="field-project-code-row">
          <div class="form-field" id="field-project-code-editable-wrapper">
            <label>Codice progetto</label>
            <span class="project-code-inputs">
              <input id="field-project-code-number" maxlength="3" size="3" placeholder="XXX" inputmode="numeric">
              <span>-20</span>
              <input id="field-project-code-year" maxlength="2" size="2" placeholder="AA" inputmode="numeric">
            </span>
          </div>
          <div class="form-field hidden" id="field-project-code-readonly-wrapper">
            <label>Codice progetto</label>
            <div id="field-project-code-readonly" class="computed-status"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field" id="field-label-wrapper">
            <label for="field-label">Stato del task</label>
            <select id="field-label">
              <option value="APERTO">Aperto (gestito automaticamente)</option>
              <option value="CHIUSO">Chiuso</option>
            </select>
          </div>
          <div class="form-field" id="field-status-open-wrapper">
            <label>Status</label>
            <div id="field-status-computed" class="computed-status"></div>
          </div>
          <div class="form-field hidden" id="field-status-closed-wrapper">
            <label for="field-status">Status</label>
            <select id="field-status"></select>
          </div>
        </div>
        <div class="form-row" id="field-dates-editable-row">
          <div class="form-field">
            <label for="field-execution-date">Data esecuzione</label>
            <input id="field-execution-date" type="date">
          </div>
          <div class="form-field" id="field-deadline-label">
            <label for="field-deadline">Deadline</label>
            <input id="field-deadline" type="date">
          </div>
        </div>
        <div class="form-field form-field--full hidden" id="field-dates-computed-wrapper">
          <label>Date (calcolate automaticamente dai figli)</label>
          <div id="field-dates-computed" class="computed-status"></div>
        </div>
        <div class="form-row" id="field-estimated-editable-row">
          <div class="form-field">
            <label>Tempo stimato</label>
            <span class="estimated-inputs">
              <input id="field-estimated-days-part" type="number" step="1" min="0" placeholder="0"><span class="unit">gg</span>
              <input id="field-estimated-hours-part" type="number" step="0.5" min="0" max="7.5" placeholder="0"><span class="unit">h</span>
            </span>
          </div>
          <div class="form-field">
            <label>Carico di lavoro</label>
            <div id="field-carico-lavoro" class="computed-status"></div>
          </div>
        </div>
        <div class="form-row hidden" id="field-estimated-computed-wrapper">
          <div class="form-field">
            <label>Tempo stimato (calcolato dai figli)</label>
            <div id="field-estimated-computed" class="computed-status"></div>
          </div>
          <div class="form-field">
            <label>Carico di lavoro</label>
            <div id="field-carico-lavoro-branch" class="computed-status"></div>
          </div>
        </div>
        <div class="form-row" id="field-assegnazione-row">
          <div class="form-field" id="field-assegnazione-editable-wrapper">
            <span class="form-field-title">Assegnazione</span>
            <div class="form-field" id="field-assegnazione-interna-controls">
              <label for="field-assegnato-interna">Interna</label>
              <select id="field-assegnato-interna">
                <option value="">—</option>
              </select>
            </div>
            <div class="form-field" id="field-assegnato-esterna-wrapper">
              <label for="field-assegnato">Esterna</label>
              <input id="field-assegnato" maxlength="20" placeholder="richiede EX e DL">
            </div>
            <button type="button" id="delega-btn">Delega</button>
          </div>
          <div class="form-field hidden" id="field-assegnazione-executor-wrapper">
            <label>Assegnazione</label>
            <div id="field-assegnazione-executor-info" class="computed-status"></div>
            <div id="field-assegnazione-executor-actions" class="hidden">
              <button type="button" id="accept-delegation-btn">Accetta</button>
              <button type="button" id="accept-as-ticket-btn">Trasforma in banana e accetta</button>
              <button type="button" id="decline-delegation-btn">Rifiuta</button>
            </div>
          </div>
          <div class="form-field hidden" id="field-assegnazione-committente-wrapper">
            <label>Assegnazione</label>
            <div id="field-assegnazione-committente-info" class="computed-status"></div>
          </div>
          <div class="form-field" id="field-dependencies-wrapper">
            <div class="form-field-label-row">
              <label>Dipendenze</label>
              <button type="button" id="dependencies-picker-btn">+</button>
            </div>
            <div id="dependencies-summary">Nessuna</div>
          </div>
        </div>
        <div class="checkbox-row">
          <label class="checkbox-label" id="field-focus-wrapper">
            <input id="field-focus" type="checkbox"> Focus
          </label>
        </div>
      </fieldset>
        <div class="hidden" id="field-completamento-conferma">
          <p class="hint">L'esecutore ha segnato questo task come completato: confermi che sia conforme alle richieste?</p>
          <div class="completamento-conferma-actions">
            <button type="button" id="confirm-completion-btn">Conferma completamento</button>
            <button type="button" id="reject-completion-btn">Rifiuta completamento</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="submit" id="modal-submit">Salva</button>
          <button type="button" id="modal-cancel">Annulla</button>
        </div>
      </form>

      <div id="checklist-wrapper" class="hidden">
        <h3>Checklist</h3>
        <div id="checklist-container"></div>
      </div>
    </div>
  </div>

  <div id="gantt-overlay" class="hidden">
    <div id="gantt-box">
      <div id="gantt-header">
        <div id="gantt-toolbar"></div>
        <h2 id="gantt-title">Gantt</h2>
        <button type="button" id="gantt-close">✕ Chiudi</button>
      </div>
      <div id="gantt-body">
        <div id="gantt-outline-pane">
          <div id="gantt-outline-super-header"></div>
          <div id="gantt-outline-header">Titolo</div>
          <div id="gantt-outline-chart-spacer"></div>
          <div id="gantt-outline-scroll">
            <div id="gantt-outline-body"></div>
          </div>
        </div>
        <div id="gantt-timeline-pane">
          <div id="gantt-timeline-super-header-scroll">
            <div id="gantt-timeline-super-header"></div>
          </div>
          <div id="gantt-timeline-header-scroll">
            <div id="gantt-timeline-header"></div>
          </div>
          <div id="gantt-timeline-chart-scroll">
            <div id="gantt-timeline-chart-inner"></div>
          </div>
          <div id="gantt-timeline-scroll">
            <div id="gantt-timeline-inner"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
